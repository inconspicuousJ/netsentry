[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentry"
description = "Offline network traffic analyser and defensive threat detection toolkit for PCAP/PCAPNG captures."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "scapy>=2.8,<3",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
netsentry = "netsentry.cli:main"

[tool.setuptools]
packages = ["netsentry"]

[tool.setuptools.dynamic]
version = { attr = "netsentry.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["netsentry", "conftest"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
